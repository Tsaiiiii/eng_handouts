<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>講義</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap"><style>
/* Layout: one narrow notebook column; the tool bar sits on top, the handout below is exactly what the student gets. */
:root{
  --paper:#f3f6fb; --card:#ffffff; --ink:#1c2740; --mute:#5d6a85; --line:#d5ddec;
  --pen:#2456c9; --pen-ink:#ffffff; --marker:#ffe066; --ok:#1f8a5b; --bad:#c8402f;
  --en:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;
  --zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#121826; --card:#1b2335; --ink:#e8edf7; --mute:#9aa6bf; --line:#303b55;
  --pen:#7ea6ff; --pen-ink:#0d1424; --marker:#7a6500; --ok:#5cc796; --bad:#ff8a78; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121826; --card:#1b2335; --ink:#e8edf7; --mute:#9aa6bf; --line:#303b55;
  --pen:#7ea6ff; --pen-ink:#0d1424; --marker:#7a6500; --ok:#5cc796; --bad:#ff8a78; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--zh);margin:0;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.btn{background:var(--pen);color:var(--pen-ink);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.btn.ghost{background:transparent;color:var(--pen);border:1.5px solid var(--pen)}
.btn:disabled{opacity:.45;cursor:default}
a.btn{display:inline-block;text-decoration:none;font-size:15px;padding:6px 14px}
.mute{color:var(--mute);font-size:14px}

/* ---- tool ---- */
.tool h1{font:600 26px/1.2 var(--zh);margin:0}
.tool{display:flex;flex-direction:column;gap:12px;border-bottom:2px dashed var(--line);padding-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row label{display:flex;gap:6px;align-items:center;font-size:14px}
.row input[type=number]{width:64px}
.row input,.row select{background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:7px 9px}
.drop{border:2px dashed var(--pen);border-radius:12px;padding:16px;background:var(--card);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.drop.over{background:var(--marker)}
.status{font-size:14px;min-height:22px}
.status.err{color:var(--bad)}
.weeks{display:flex;flex-wrap:wrap;gap:6px}
.weeks button{background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:5px 14px}
.weeks button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
details.edit{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}
details.edit summary{cursor:pointer;font-weight:600}
.etable{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.erow{display:grid;grid-template-columns:110px 1fr 32px;gap:6px}
.erow input{min-width:0;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:5px 7px}
.erow .wide{grid-column:1/3}
.erow button{background:none;border:0;color:var(--bad);font-size:18px}

/* ---- handout ---- */
.ho{display:flex;flex-direction:column;gap:16px}
/* 上方 [← 講義目錄]　標題置中　[換人]，和閱讀講義一樣 */
.ho-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.ho-head .c{text-align:center;min-width:0}
.ho-head h2{font:600 24px/1.2 var(--en),var(--zh);margin:0;overflow-wrap:anywhere}
.ho-head .r{justify-self:end}
@media (max-width:520px){.ho-head{grid-template-columns:1fr 1fr}.ho-head .c{grid-column:1/-1;grid-row:2}}
.tabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.tabs button{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 4px;font-size:15px}
.tabs button[aria-selected=true]{border-color:var(--pen);color:var(--pen);font-weight:700;box-shadow:inset 0 -3px 0 var(--pen)}
.tabs .done::after{content:" ✓";color:var(--ok)}
.stage{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;min-height:320px}
.count{font-size:13px;color:var(--mute);letter-spacing:.04em}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pen);transition:width .25s}
.count.fix{color:var(--ink);font-weight:700}
.bar.fix i{background:var(--marker)}
.word{font:600 clamp(38px,11vw,58px)/1.1 var(--en);overflow-wrap:anywhere}
.word span,.hl{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 4px}
.kk{font-family:"Segoe UI","Lucida Sans Unicode",sans-serif;color:var(--mute)}
.pos{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:13px;color:var(--mute);margin-right:6px}
.zh{font-size:24px;font-weight:700}
.more{font-size:14px;color:var(--mute)}
.senses{display:flex;flex-direction:column;gap:14px}
.form{background:var(--paper);border-radius:8px;padding:6px 10px;font-size:15px;font-weight:600}
.sense{display:flex;flex-direction:column;gap:6px;border-top:1.5px solid var(--line);padding-top:12px}
.sense-h{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.sense-h .zh{font-size:21px}
.badge{background:var(--ink);color:var(--paper);border-radius:999px;font-size:13px;padding:1px 9px;font-weight:600}
.tag{font-size:14px;color:var(--mute);font-family:var(--en),var(--zh)}
.ph{font:500 16px/1.5 var(--en),var(--zh);background:var(--paper);border-radius:8px;padding:5px 10px}
.ph b{font:600 12px var(--zh);color:var(--pen);margin-right:8px;letter-spacing:.05em}
.eg .en,.eg .tr,.q{white-space:pre-line}
.eg{border-left:3px solid var(--pen);padding-left:12px}
.eg .en{font:500 19px/1.5 var(--en)}
.eg .tr{color:var(--mute);font-size:15px}
.q{font:500 20px/1.55 var(--en),var(--zh)}
.nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:12px;text-align:left;font-size:17px;min-width:0;overflow-wrap:anywhere}
.opt.en{font-family:var(--en);font-size:19px}
.opt.sel{border-color:var(--pen);box-shadow:0 0 0 2px var(--pen)}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.opt.gone{visibility:hidden}
.opt:disabled{cursor:default}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cols>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.fb{font-size:16px;font-weight:600}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.exp{font-size:15px;color:var(--mute)}
form.stage{min-height:0}form.stage .type-in{flex:none}
.type-in{flex:1 1 180px;min-width:0;font:500 22px var(--en);background:var(--paper);border:0;border-bottom:3px solid var(--ink);padding:6px 4px;color:var(--ink)}
.rtitle{font:600 24px/1.3 var(--en),var(--zh)}
.para{font:400 18px/1.85 var(--en),var(--zh);margin:0}
.para .hl{cursor:pointer}
.gl{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--mute);border-top:1.5px solid var(--line);padding-top:10px}
.rq{display:flex;flex-direction:column;gap:10px;border-top:1.5px solid var(--line);padding-top:14px}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:38px;height:46px;border-bottom:3px solid var(--ink);font:600 28px/46px var(--en);text-align:center}
.slot.sp{border:0;width:14px}
.tile{width:44px;height:48px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font:600 24px var(--en)}
.tile.used{visibility:hidden}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i{transition:none}}
.learn-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px}
.learn-top .btn{padding:6px 14px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.small{padding:2px}
.chips.small .chip[aria-pressed=true]{background:var(--pen);color:var(--pen-ink);border-color:var(--pen)}
.chip{font:500 16px var(--en);background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:5px 13px;color:var(--ink)}
.chips.small .chip{font-size:14px;padding:3px 10px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.phl{display:flex;flex-direction:column;gap:6px}
.phr{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink)}
.phr .en{font:500 17px var(--en)}
.phr .pzh{font-size:15px}
.phr .pw{font:500 13px var(--en);color:var(--mute)}
@media (max-width:520px){.phr{grid-template-columns:1fr auto}.phr .pzh{grid-column:1/-1;grid-row:2}}
.exp{white-space:pre-line}
.end{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;margin:auto}
.end b{font:600 44px var(--en)}
</style></head><body><div class="wrap"><div class="ho" id="ho"></div></div><script>window.__CFG={"log":"https://script.google.com/macros/s/AKfycbxQfNaZ9VYbyEA62i0rtrSW58h0vhLVZcgFnbWGu8HOv6bLTKGxwtv8BUjGmIZDi-8JfQ/exec","name":""}</script><script>function mountHandout(root, data){
  var W=data.words||[], EX=data.exercises||[], KEY='ho:'+data.title;

  function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

  function S(w){return w.senses&&w.senses.length?w.senses:[{pos:w.pos,zh:w.zh,ex:w.example?[{en:w.example,zh:w.example_zh}]:[]}]}

  function cp(t){return String(t||'').replace(/^\s*(常見)?片語\s*(與|和|及|\/|／)?\s*(搭配詞?)?\s*[:：]?\s*/,'').trim()}
  var done={};
  /* 作答紀錄：下載的講義裡有 window.__CFG={log:'Apps Script 網址',name:'固定學生名字'}；學生名字和單字、閱讀講義共用 eng-student */
  var CFG=window.__CFG||null,sess,LOG=data.log||(CFG&&CFG.log?{url:CFG.log,name:CFG.name||''}:null),QK='ho-q:'+data.title,Q=[],busy=0;
  try{Q=JSON.parse(localStorage.getItem(QK)||'[]')}catch(e){}
  var NK='eng-student',who=(LOG&&LOG.name)||'',askWho=!!(LOG&&LOG.url&&!LOG.name);
  if(!who){try{who=localStorage.getItem(NK)||localStorage.getItem('ho-student')||''}catch(e){}}
  /* 打勾（完成的關卡）每位學生分開記，換人後是新的進度 */
  function dkey(){return KEY+(who?'@'+who:'')}
  function loadDone(){done={};try{done=JSON.parse(localStorage.getItem(dkey())||'{}')}catch(e){}}
  loadDone();
  function askName(){stage.textContent='';var f=el('form','end'),inp=el('input','type-in'),b=el('button','btn','開始');
    inp.setAttribute('aria-label','你的名字');inp.value=who;inp.autocomplete='off';
    f.append(el('div','zh','你是誰？'),el('div','mute','輸入你的名字或暱稱，老師才知道這是誰的練習紀錄'),inp,b);
    f.onsubmit=function(e){e.preventDefault();var v=inp.value.trim();if(!v)return;who=v;try{localStorage.setItem(NK,v)}catch(x){}loadDone();
      whoBtn.textContent=who+'（換人）';reset();cur=TABS[0][0];drawTabs();TABS[0][2]()};
    stage.append(f);inp.focus({preventScroll:true})}
  function reset(){sess={t:Date.now(),wrong:[],hint:0}}
  reset();
  function note(x){if(sess.wrong.indexOf(x)<0)sess.wrong.push(x)}
  function saveQ(){try{localStorage.setItem(QK,JSON.stringify(Q.slice(-200)))}catch(e){}}
  function flush(){if(!LOG||!LOG.url||!Q.length||busy)return;busy=1;var row=Q[0];
    fetch(LOG.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)})
      .then(function(){var k=Q.indexOf(row);if(k>=0)Q.splice(k,1);saveQ();busy=0;flush()}).catch(function(){busy=0})}
  function report(id,r){if(LOG&&LOG.url){var act=id;TABS.forEach(function(t){if(t[0]===id)act=t[1]});
      Q.push({t:new Date().toISOString(),name:who||'未填名字',kind:'單字',unit:data.title,act:act,right:r.right,total:r.total,miss:r.miss||0,hint:sess.hint,
        secs:Math.round((Date.now()-sess.t)/1000),wrong:sess.wrong.join('、')});saveQ();flush()}
    reset()}
  function mark(id){done[id]=1;try{localStorage.setItem(dkey(),JSON.stringify(done))}catch(e){}drawTabs()}
  function hl(text,word){var p=el('span');var re=new RegExp('\\b'+word.replace(/[^\w ]/g,'').split(' ')[0]+'[a-z]*','i');var m=re.exec(text);
    if(!m){p.textContent=text;return p}
    p.append(text.slice(0,m.index));p.append(el('span','hl',m[0]));p.append(text.slice(m.index+m[0].length));return p}
  function sayBtn(t){var b=el('button','btn ghost','聽發音');b.onclick=function(){say(t)};b.hidden=!canSay;return b}
  /* 第一輪照題數走；答錯的題目留到最後，用另一條「訂正」進度條，學生看得到還剩幾題 */
  function stepHead(it,n,total,queue,fixT){if(!it.retry)return progress(n,total);
    var j=fixT-queue.length,f=document.createDocumentFragment();f.append(el('div','count fix','訂正答錯的題目　第 '+j+' / '+fixT+' 題'));
    var b=el('div','bar fix'),x=el('i');x.style.width=((j-1)/fixT*100)+'%';b.append(x);f.append(b);return f}
  function nextLabel(it,queue){if(!queue.length)return '看成績';
    if(!it.retry&&queue.every(function(q){return q.retry}))return '開始訂正答錯的 '+queue.length+' 題';return '下一題'}
  function progress(i,n){var f=document.createDocumentFragment();f.append(el('div','count','第 '+Math.min(i+1,n)+' / '+n+' 題'));var b=el('div','bar'),x=el('i');x.style.width=(i/n*100)+'%';b.append(x);f.append(b);return f}
  function finish(id,msg,score,again,r){if(r)report(id,r);stage.textContent='';var d=el('div','end');d.append(el('b',null,score),el('div','zh',msg));var b=el('button','btn','再練一次');b.onclick=again;d.append(b);stage.append(d);mark(id)}

  var PH=phrases();
  var TABS=[['learn','認識單字',learn],['match','配對',match],['quiz','選意思',quiz],['spell','拼字',spell]];
  if(W.some(function(w){return S(w).length>1}))TABS.splice(3,0,['sense','一字多義',sense]);
  if(PH.length>=4)TABS.push(['phrase','片語／搭配詞',phrase]);
  TABS.push(['basic','基礎練習',basic]);
  if(EX.some(function(e){return e.type!=='fill'&&e.options&&e.options.length}))TABS.push(['exam','會考演練',exam]);
  TABS.push(['test','單元測驗',test]);
  if(data.reading&&data.reading.text)TABS.unshift(['read','主題閱讀',read]);
  var cur=TABS[0][0];
  root.textContent='';
  var head=el('div','ho-head');var whoBtn=el('button','btn ghost',(who||'填名字')+'（換人）');whoBtn.hidden=!askWho;whoBtn.onclick=askName;
  var hL=el('div'),hC=el('div','c'),hR=el('div','r');
  if(CFG){var hm=/\/(vocab|reading)\/[^\/]*$/.test(location.pathname)?'../':'./',home=el('a','btn ghost','← 講義目錄');home.href=hm;hL.append(home);
    if(!document.querySelector('link[rel=icon]'))['icon','apple-touch-icon'].forEach(function(r){var l=document.createElement('link');l.rel=r;l.href=hm+'eng.png';document.head.append(l)})}
  hC.append(el('h2',null,data.title),el('div','mute',W.length+' 個單字'));hR.append(whoBtn);
  head.append(hL,hC,hR);
  var tabs=el('div','tabs');tabs.setAttribute('role','tablist');

  function drawTabs(){tabs.textContent='';TABS.forEach(function(t){var b=el('button',done[t[0]]?'done':'',t[1]);b.setAttribute('role','tab');b.setAttribute('aria-selected',cur===t[0]);b.onclick=function(){cur=t[0];reset();drawTabs();t[2]()};tabs.append(b)})}

  function read(){var R=data.reading,qs=R.questions||[],left=qs.length,rr=0;stage.textContent='';
    if(R.title)stage.append(el('div','rtitle',R.title));
    var tip=el('div','mute','點一下畫線的單字可以聽發音、看意思');
    var re=new RegExp('\\b('+W.map(function(w){return w.word.replace(/[^\w ]/g,'')}).join('|')+')(?:s|es|d|ed|ing|er|est)?\\b','gi');
    String(R.text).split(/\n+/).forEach(function(t){if(!t.trim())return;var pp=el('p','para'),last=0,m;re.lastIndex=0;
      while(W.length&&(m=re.exec(t))){pp.append(t.slice(last,m.index));var sp=el('span','hl',m[0]);sp.tabIndex=0;sp.setAttribute('role','button');
        (function(base,shown){sp.onclick=sp.onkeydown=function(e){if(e.type==='keydown'&&e.key!=='Enter')return;var w=W.filter(function(x){return x.word.toLowerCase()===base.toLowerCase()})[0];
          say(shown);tip.className='fb';tip.textContent=shown+'：'+(w?S(w).map(function(a){return a.zh}).filter(Boolean).join('／'):'')}})(m[1],m[0]);
        pp.append(sp);last=m.index+m[0].length}
      pp.append(t.slice(last));stage.append(pp)});
    stage.append(tip);
    if(R.glossary&&R.glossary.length){var g=el('div','gl');R.glossary.forEach(function(x){g.append(el('span',null,x.en+' '+x.zh))});stage.append(g)}
    qs.forEach(function(q,k){var b=el('div','rq');b.append(el('div','q',(k+1)+'. '+q.question));var opts=el('div','opts'),fb=el('div');
      (q.options||[]).forEach(function(o){var bt=el('button','opt en',o);bt.onclick=function(){
        [].forEach.call(opts.children,function(c){c.disabled=true;if(c.textContent===q.answer)c.classList.add('right')});
        if(o===q.answer){rr++;fb.className='fb ok';fb.textContent='答對了！'}else{note('第'+(k+1)+'題→'+o);bt.classList.add('wrong');fb.className='fb no';fb.textContent='正確答案是：'+q.answer}

    if(!qs.length)mark('read')}

  /* 認識單字：上方一排單字可以直接點選跳過去；「挑選單字」可以只看自己選的幾個字 */
  var PK=KEY+':pick',pick=null;
  function loadPick(){pick=null;try{var a=JSON.parse(localStorage.getItem(PK+(who?'@'+who:''))||'null');if(a&&a.length)pick=a}catch(e){}}
  function savePick(){try{localStorage.setItem(PK+(who?'@'+who:''),JSON.stringify(pick||null))}catch(e){}}
  function learnList(){loadPick();var L=W.filter(function(w){return !pick||pick.indexOf(w.word)>=0});return L.length?L:W}
  function chooser(back){stage.textContent='';var sel={};(pick||W.map(function(w){return w.word})).forEach(function(k){sel[k]=1});
    var grid=el('div','chips'),cnt=el('div','count');
    function upd(){var n=Object.keys(sel).filter(function(k){return sel[k]}).length;cnt.textContent='已選 '+n+' / '+W.length+' 個字';go.disabled=!n;go.textContent='開始看這 '+n+' 個字'}
