async function open_(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(S),iterations:N,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(I)},k,u(D));
  const h=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('rvpw',pw)}catch(e){}
  document.open();document.write(h);document.close();
}
const m=document.getElementById('m');
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();
  if(!(window.crypto&&crypto.subtle)){m.textContent='這個瀏覽器無法解密，請用 https 網址開啟。';return}
  m.textContent='';open_(document.getElementById('pw').value).catch(()=>{m.textContent='密碼不正確，請再試一次。'})});
