<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>英文講義</title>
<link rel="icon" href="eng.png">
<link rel="apple-touch-icon" href="eng.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--paper:#f3f6fb;--card:#fff;--ink:#1c2740;--mute:#5d6a85;--line:#d5ddec;--pen:#2456c9;--marker:#ffe066;
  --en:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;--zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#121826;--card:#1b2335;--ink:#e8edf7;--mute:#9aa6bf;--line:#303b55;--pen:#7ea6ff;--marker:#7a6500;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--zh);padding:32px 16px 48px}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1{font:600 30px/1.2 var(--zh);margin:0}
h1{display:flex;align-items:center;gap:12px}
h1 img{width:44px;height:44px}
h1 span{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 4px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px;align-items:start}
section{display:flex;flex-direction:column;gap:10px;min-width:0}
h2{font:600 20px/1.3 var(--zh);margin:0;padding-bottom:6px;border-bottom:2px solid var(--ink)}
h2 small{font:400 13px var(--zh);color:var(--mute);margin-left:8px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li.empty{color:var(--mute);font-size:14px}
a{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;color:var(--ink);text-decoration:none;font:600 20px var(--en),var(--zh);overflow-wrap:anywhere}
a::after{content:"開始 →";font:600 14px var(--zh);color:var(--pen);white-space:nowrap}
a:hover,a:focus-visible{border-color:var(--pen);outline:none}
.me{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.me form{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.me label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--mute);flex:1 1 160px}
.me input{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.me button{font:600 15px var(--zh);border-radius:10px;padding:9px 18px;cursor:pointer;border:1.5px solid var(--pen)}
.me .go{background:var(--pen);color:var(--card)}
.me .alt{background:transparent;color:var(--pen)}
.me .hi{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font-size:17px}
.me .tip{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1><img src="eng.png" alt=""><span>英文講義</span></h1>
  <section class="me" id="me" aria-label="學生資料"></section>
  <div class="cols">
    <section><h2>單字<small>Vocabulary</small></h2><ul id="vocab"></ul></section>
    <section><h2>閱讀<small>Reading</small></h2><ul id="reading"></ul></section>
  </div>
</main>
<script>
/* 這一頁會自動列出 repo 裡的講義，上傳新檔案後不用改這個檔案。

   分類規則（兩種放法都可以，也可以混用）：
   1. 用資料夾：放在 reading/ 資料夾裡的是閱讀，放在 vocab/ 資料夾裡的是單字。
   2. 用檔名：放在最外層、檔名以 Reading 開頭的是閱讀（例如 Reading_01.html），其他都算單字（例如 Unit_01.html）。

   自動列表失敗時，會改用下面的手動清單；需要時把新檔案的路徑加進去即可。 */
var MANUAL = { vocab: ['vocab/Unit_01.html'], reading: ['reading/Week1.html'] };
var OWNER = 'Tsaiiiii', REPO = 'eng_handouts';

if (/\.github\.io$/.test(location.hostname)) {
  OWNER = location.hostname.split('.')[0];
  REPO = location.pathname.split('/')[1] || REPO;
}
/* 學生資料：名字和講義密碼存在這台裝置上，單字講義、閱讀講義都會直接使用，不用每份講義重新輸入。 */
function get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function put(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) {} }
function me(edit) {
  var box = document.getElementById('me'), name = get('eng-student'), pw = get('eng-pw');
  box.textContent = '';
  if (name && !edit) {
    var hi = document.createElement('div'), t = document.createElement('span'), b = document.createElement('button');
    hi.className = 'hi'; t.textContent = '嗨，' + name + '！選一份講義開始練習吧。';
    b.className = 'alt'; b.type = 'button'; b.textContent = '換人';
    b.onclick = function () { put('eng-student', ''); me(true); };
    hi.append(t, b); box.append(hi);
    return;
  }
  var f = document.createElement('form');
  f.innerHTML = '<label>你的名字<input id="nm" autocomplete="off" required></label>' +
    '<label>講義密碼<input id="pw" type="password" autocomplete="off" placeholder="' + (pw ? '已記住，不用再填' : '老師給的密碼') + '"></label>' +
    '<button class="go">開始</button>';
  f.querySelector('#nm').value = name;
  f.onsubmit = function (e) {
    e.preventDefault();
    var n = f.querySelector('#nm').value.trim(), p = f.querySelector('#pw').value;
    if (!n) return;
    put('eng-student', n); if (p) put('eng-pw', p);
    me();
  };
  var tip = document.createElement('div'); tip.className = 'tip';
  tip.textContent = '只要填一次。老師會從作答紀錄看到你的名字；換別人用這台裝置時按「換人」。';
  box.append(f, tip);
}
me();

function label(path) {
  return path.split('/').pop().replace(/\.html?$/i, '').replace(/[_-]+/g, ' ').replace(/([a-z])(\d)/gi, '$1 $2');
}
function show(id, paths) {
  var ul = document.getElementById(id); ul.textContent = '';
  paths.slice().sort(function (a, b) { return label(a).localeCompare(label(b), undefined, { numeric: true }); })
    .forEach(function (p) {
      var li = document.createElement('li'), a = document.createElement('a');
      a.href = p.split('/').map(encodeURIComponent).join('/');
      a.textContent = label(p);
      li.append(a); ul.append(li);
    });
  if (!paths.length) { var e = document.createElement('li'); e.className = 'empty'; e.textContent = '還沒有講義'; ul.append(e); }
}
function isPage(name) { return /\.html?$/i.test(name) && !/^index\.html?$/i.test(name); }
function list(dir) {
  return fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + dir)
    .then(function (r) { if (!r.ok) throw 0; return r.json(); });
}

show('vocab', MANUAL.vocab); show('reading', MANUAL.reading);

list('').then(function (root) {
  var out = { vocab: [], reading: [] }, jobs = [];
  root.forEach(function (x) {
    if (x.type === 'file' && isPage(x.name)) out[/^reading/i.test(x.name) ? 'reading' : 'vocab'].push(x.name);
    if (x.type === 'dir' && /^(vocab|reading)$/i.test(x.name)) {
      jobs.push(list(x.name).then(function (items) {
        items.forEach(function (f) { if (f.type === 'file' && isPage(f.name)) out[x.name.toLowerCase()].push(x.name + '/' + f.name); });
      }));
    }
  });
  return Promise.all(jobs).then(function () { show('vocab', out.vocab); show('reading', out.reading); });
}).catch(function () {});
</script>
</body>
</html>
