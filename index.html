<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>英文講義</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--paper:#f3f6fb;--card:#fff;--ink:#1c2740;--mute:#5d6a85;--line:#d5ddec;--pen:#2456c9;--marker:#ffe066;
  --en:"Fredoka","Trebuchet MS","Segoe UI",sans-serif;--zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--paper:#121826;--card:#1b2335;--ink:#e8edf7;--mute:#9aa6bf;--line:#303b55;--pen:#7ea6ff;--marker:#7a6500;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.6 var(--zh);padding:32px 16px 48px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:600 30px/1.2 var(--zh);margin:0}
h1 span{background:linear-gradient(transparent 55%,var(--marker) 55%);padding:0 4px}
p{margin:0;color:var(--mute);font-size:14px}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
a{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:16px 18px;color:var(--ink);text-decoration:none;font:600 22px var(--en),var(--zh)}
a::after{content:"開始 →";font:600 14px var(--zh);color:var(--pen);white-space:nowrap}
a:hover,a:focus-visible{border-color:var(--pen);outline:none}
</style>
</head>
<body>
<main>
  <h1><span>英文講義</span></h1>
  <p id="note">選一個單元開始練習。</p>
  <ul id="list"></ul>
</main>
<script>
/* 自動列出這個 repo 裡所有的講義檔。上傳新的 Unit_XX.html 後不用改這個檔案。
   如果自動列表失敗，會改用下面這份手動清單；需要時把新檔名加進去即可。 */
var MANUAL = ['Unit_01.html'];
var OWNER = 'Tsaiiiii', REPO = 'eng_handouts';

if (/\.github\.io$/.test(location.hostname)) {           // 換了帳號或 repo 名稱也能自動對上
  OWNER = location.hostname.split('.')[0];
  REPO = location.pathname.split('/')[1] || REPO;
}
function show(files) {
  var ul = document.getElementById('list'); ul.textContent = '';
  files.filter(function (f) { return /\.html?$/i.test(f) && !/^index\.html?$/i.test(f); })
    .sort(function (a, b) { return a.localeCompare(b, undefined, { numeric: true }); })
    .forEach(function (f) {
      var li = document.createElement('li'), a = document.createElement('a');
      a.href = encodeURIComponent(f);
      a.textContent = f.replace(/\.html?$/i, '').replace(/_/g, ' ');
      li.append(a); ul.append(li);
    });
  if (!ul.children.length) document.getElementById('note').textContent = '還沒有講義。';
}
show(MANUAL);
fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/')
  .then(function (r) { if (!r.ok) throw 0; return r.json(); })
  .then(function (items) { show(items.filter(function (x) { return x.type === 'file'; }).map(function (x) { return x.name; })); })
  .catch(function () {});
</script>
</body>
</html>
